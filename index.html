<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Call — Departures</title>
<meta name="description" content="Illustrated trip itineraries.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  /* Inline, so the page is black before any stylesheet arrives — the styles are
     imported by a JS module, which leaves a moment with unstyled markup. */
  html,body{margin:0;background:#0A0A0A}
  #boot{
    position:fixed;inset:0;z-index:999;
    display:flex;align-items:center;justify-content:center;
    background:#0A0A0A;
    font:600 11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.42em;color:rgba(255,255,255,.3);
    transition:opacity .5s ease;
  }
  #boot.hide{opacity:0;pointer-events:none}
</style>
</head>
<body class="dep-page">

<div id="boot">LOADING&hellip;</div>

<!-- One stack, anchored so the board's bottom sits 100px below the fold. The
     gaps between title, labels and board are margins inside it, so they hold
     whatever the board's height turns out to be. -->
<div class="dep-stack">
  <header class="dep-head">
    <span class="dep-icon" aria-hidden="true"></span>
    <h1 class="dep-title">DEPARTURES</h1>
  </header>

  <div class="dep-labels" aria-hidden="true">
    <span class="dep-label dep-label--time">TIME</span>
    <span class="dep-label dep-label--dest">DESTINATION</span>
    <span class="dep-label dep-label--status">STATUS</span>
  </div>

  <main class="dep-board" id="board" aria-label="Departures"></main>
</div>

<script type="module" src="/src/landing.js"></script>
</body>
</html>
