<!-- Per-trip POI pin — Australia v2. Three variants, one per stop
     type (trip.json's stops[].stopType), matching Figma's "Poi" component
     (node 164:401, file AI_TRAVEL-AGENT): a taller yellow badge for a
     basecamp (a multi-night hub), a shorter green one for a short stay,
     and a bare dot for a day-trip spur with no overnight.

     src/js/map.js picks one of these three <svg data-pin-type="…"> blocks
     per stop (falling back to using this whole file for every type, like
     the old one-shape design, if it finds no data-pin-type at all — see
     loadPin()). Each variant's root carries .poi-shape, which main.css's
     generic .poi .poi-shape rule already sizes (width:100%;height:auto)
     and makes the actual hit-target (.poi itself is pointer-events:none,
     so two overlapping pin boxes can't steal each other's clicks).

     The dot (.poi-dot) and the badge (.poi-badge) are separate elements,
     not one flattened shape — main.css gives each its own small idle
     animation, which only works if they're not fighting over one
     transform.

     Colour comes from --pin-fill, set per-location in src/js/map.js from
     locations[].pinColor — so different stops can use different colours
     (matching whichever route segment leads to them) without each
     needing their own SVG file. The day-trip dot is flat black instead,
     matching Figma — it's the de-emphasised marker of the three. -->
<svg class="poi-shape" data-pin-type="basecamp" viewBox="0 0 12 23.5" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect class="poi-dot" x="1.5" y="14.5" width="9" height="9" rx="4.5" fill="white"/>
  <path class="poi-badge" d="M1.45397 15.7104L4.95397 17.8581C5.59573 18.2519 6.40427 18.2519 7.04603 17.8581L10.546 15.7104C11.1388 15.3467 11.5 14.7012 11.5 14.0057V2.5C11.5 1.39543 10.6046 0.5 9.5 0.5H2.5C1.39543 0.5 0.5 1.39543 0.5 2.5V14.0057C0.5 14.7012 0.861241 15.3467 1.45397 15.7104Z" fill="var(--pin-fill, #FDC816)" stroke="white"/>
</svg>
<svg class="poi-shape" data-pin-type="stay" viewBox="0 0 12 18.5" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect class="poi-dot" x="1.5" y="9.5" width="9" height="9" rx="4.5" fill="white"/>
  <path class="poi-badge" d="M1.45397 10.7104L4.95397 12.8581C5.59573 13.2519 6.40427 13.2519 7.04603 12.8581L10.546 10.7104C11.1388 10.3467 11.5 9.70117 11.5 9.00574V2.5C11.5 1.39543 10.6046 0.5 9.5 0.5H2.5C1.39543 0.5 0.5 1.39543 0.5 2.5V9.00574C0.5 9.70117 0.861241 10.3467 1.45397 10.7104Z" fill="var(--pin-fill, #00824B)" stroke="white"/>
</svg>
<svg class="poi-shape" data-pin-type="daytrip" viewBox="0 0 11 9" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect class="poi-dot poi-dot--daytrip" x="1" y="0" width="9" height="9" rx="4.5" fill="#000"/>
</svg>
